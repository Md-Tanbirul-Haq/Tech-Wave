<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Wave</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="margin_class mt-5 mb-3">
            <div class="text-white flex justify-between">
                <div class=" text-3xl font-bold ">Tech<span class="text-purple-900">Wave</span></div>
                <div>
                    <ul class=" flex justify-between gap-5">
                        <li>About</li>
                        <li>Episodes</li>
                        <li>Host</li>
                    </ul>
                </div>
                <div>
                    <button class="btn">Subscribe</button>
                </div>
            </div>

        </nav>
        <hr class="mb-5 text-purple-900">
        <section id="banner">


            <div class="banner_img">
                <img class="outer" src="images/hero-circle.png" alt="">
                <img class="inner_img" src="images/microphone.png" alt="">
                <button class="btn-1">NEW</button>
            </div>
            <div class="banner_text">
                <div class=" text-6xl font-bold text-white mt-5">TechWave</div>
                <div class="text-white">Your daily dose of tech insights, productivity hacks, and personal growth</div>
                <div class="flex gap-5 mt-5">
                    <button class="flex items-center gap-5 text-white btn"><img src="images/spotify.png" alt=""><span>Listen on Spotify</span></button>
                    <button class="flex  items-center gap-5 text-green-500 btn-2"><img src="images/message.png" alt=""><span>Subscribe</span></button>
                </div>
            </div>



        </section>
    </header>
</body>

</html>
